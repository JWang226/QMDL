  "ComparatorChallenges.ChannelInterface",
  "ComparatorChallenges.ErrorScale",
  "ComparatorChallenges.Qmdl",
  "ComparatorChallenges.PhysicalInterface",
  "ComparatorChallenges.Theorem1Achievability",
  "ComparatorChallenges.Theorem1Converse",
  "ComparatorChallenges.Theorem2Choi",
]

[[lean_lib]]
