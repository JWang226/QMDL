name = "freeEntropy"
version = "0.1.0"
defaultTargets = ["FreeEntropy"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "f156f7abd91ac67adb22bf999e5a71ba22e22e41"

[[lean_lib]]
name = "FreeEntropy"

[[require]]
